{% extends 'base.html' %}
{% block content %}
<h3>Surat Keluar (Template)</h3>
<form method="post" class="card card-body mb-4">
  <div class="row g-2">
    <div class="col-md-2"><input name="number" class="form-control" placeholder="No surat" required></div>
    <div class="col-md-3"><input name="subject" class="form-control" placeholder="Perihal" required></div>
    <div class="col-md-2"><input name="recipient" class="form-control" placeholder="Tujuan" required></div>
    <div class="col-md-3">
      <select name="template_type" class="form-select" required>
        {% for t in templates %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-2"><button class="btn btn-primary w-100">Simpan</button></div>
    <div class="col-12"><textarea name="content" class="form-control" rows="3" placeholder="Isi surat" required></textarea></div>
  </div>
</form>
<table class="table table-striped table-sm">
  <tr><th>No</th><th>Nomor</th><th>Perihal</th><th>Template</th><th>Tujuan</th></tr>
  {% for l in letters %}
  <tr><td>{{ loop.index }}</td><td>{{ l.number }}</td><td>{{ l.subject }}</td><td>{{ l.template_type }}</td><td>{{ l.recipient }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
